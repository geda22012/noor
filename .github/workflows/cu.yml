name: Custom adhan test
on:
  workflow_dispatch:
    inputs:
      old: {default: v3.0.0}
jobs:
  cu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
        with: {path: new, fetch-depth: 0}
      - run: git -C new worktree add ../oldsrc ${{ github.event.inputs.old }}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: pip install websocket-client
      - name: build both with same debug key
        run: |
          mkdir -p ~/.android && keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for d in oldsrc new; do (cd $d && npm install >/dev/null 2>&1 && bash setup.sh >/dev/null 2>&1 && cd android && chmod +x gradlew && ./gradlew assembleDebug -q); done
          cp oldsrc/android/app/build/outputs/apk/debug/app-debug.apk old.apk
          cp new/android/app/build/outputs/apk/debug/app-debug.apk new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash new/ci/cu_test.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cu-${{ matrix.api }}
          path: /tmp/emu-cu-${{ matrix.api }}

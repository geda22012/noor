name: Diag test
on:
  workflow_dispatch:
    inputs:
      old: {default: v2.9.1}
jobs:
  upg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: new}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: old release apk
        run: curl -sL -o old.apk https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.old }}/noor.apk && ls -l old.apk
      - name: production key
        env:
          KS: ${{ secrets.NOOR_KEYSTORE_B64 }}
        run: |
          test -n "$KS" && echo "$KS" | base64 -d > "$RUNNER_TEMP/noor.ks" && echo "NOOR_KS=$RUNNER_TEMP/noor.ks" >> "$GITHUB_ENV"
      - run: cd new && npm install >/dev/null 2>&1 && bash setup.sh >/dev/null 2>&1 && cd android && chmod +x gradlew && ./gradlew assembleDebug -q && cp app/build/outputs/apk/debug/app-debug.apk ../../new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash new/ci/flow_test.sh 34
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upg2
          path: |
            /tmp/emu-upg2-34
            new.apk

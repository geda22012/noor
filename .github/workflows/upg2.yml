name: Custom adhan test
on:
  workflow_dispatch:
    inputs:
      old: {default: v3.0.0}
      run: {required: true}
jobs:
  cu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
        with: {path: new, fetch-depth: 0}
      - run: pip install websocket-client
      - name: exact distributable APK from the Build APK run, plus released v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.inputs.run }} -R ${{ github.repository }} -n noor-apk -D dl
          cp dl/app-debug.apk new.apk
          curl -sL -o old.apk https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.old }}/noor.apk
          ls -l old.apk new.apk
          sha256sum old.apk new.apk | tee sha.txt
          { echo "== old (released ${{ github.event.inputs.old }})"; keytool -printcert -jarfile old.apk | grep -E "Owner|SHA256|Valid"; echo "== new (Build APK run ${{ github.event.inputs.run }})"; keytool -printcert -jarfile new.apk | grep -E "Owner|SHA256|Valid"; } | tee cert.txt
          O=$(keytool -printcert -jarfile old.apk | grep SHA256); N=$(keytool -printcert -jarfile new.apk | grep SHA256); [ "$O" = "$N" ] && echo "CERT MATCH" | tee -a cert.txt || { echo "CERT MISMATCH" | tee -a cert.txt; }
          mkdir -p /tmp/emu-cu-${{ matrix.api }}; cp sha.txt cert.txt /tmp/emu-cu-${{ matrix.api }}/
      - name: synthetic 128 s AAC test file (tones, not a recording)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -y -f lavfi -i "sine=f=300:d=128:sample_rate=44100" -f lavfi -i "sine=f=450:d=128:sample_rate=44100" -filter_complex "[0][1]amerge=inputs=2" -c:a aac -b:a 130k real-format.m4a
          ls -l real-format.m4a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash new/ci/cu_test.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cu-${{ matrix.api }}
          path: /tmp/emu-cu-${{ matrix.api }}

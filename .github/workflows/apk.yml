name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Restore release signing key (from repository secret)
        env:
          KS: ${{ secrets.NOOR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "using stored key" && keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2; fi
      - run: npm install
      - run: bash setup.sh
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: noor-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}

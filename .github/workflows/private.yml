name: Private build and test
on:
  push:
    branches: [priv-build]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.b.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: signing key
        env:
          KS: ${{ secrets.NOOR_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/noor.ks" && echo "NOOR_KS=$RUNNER_TEMP/noor.ks" >> "$GITHUB_ENV"
      - name: private inputs
        env:
          K: ${{ secrets.PRIV_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh; echo "$K" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q git@github.com:geda22012/noor-private-assets.git "$RUNNER_TEMP/priv"
          mkdir -p assets && cp "$RUNNER_TEMP/priv/adhan_main.m4a" assets/adhan_main.m4a; cp "$RUNNER_TEMP/priv/azkar_morning.wav" "$RUNNER_TEMP/priv/azkar_evening.wav" "$RUNNER_TEMP/priv/dua_after.wav" "$RUNNER_TEMP/priv/azkar_salat.wav" assets/
          ls -l assets/adhan_main.m4a | awk '{print "private asset bytes:", $5}'
      - run: npm install
      - run: bash setup.sh
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug -q
      - id: b
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/new.apk"
          sha256sum "$RUNNER_TEMP/new.apk"
          N=noor-${GITHUB_SHA::7}.apk
          cd "$RUNNER_TEMP/priv"; git config user.email b@x; git config user.name build
          git checkout -q -B builds; cp "$RUNNER_TEMP/new.apk" "$N"; git add "$N"; git commit -qm "build $N"; git push -q -f origin builds
          echo "apk=$N" >> "$GITHUB_OUTPUT"
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [flow_test.sh, dl_test.sh, diag_test.sh]
    steps:
      - uses: actions/checkout@v4
        with: {path: new}
      - run: pip install websocket-client
      - name: exact APK from the private build, and the released old version
        env:
          K: ${{ secrets.PRIV_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh; echo "$K" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q --branch builds --depth 1 git@github.com:geda22012/noor-private-assets.git priv
          cp priv/${{ needs.build.outputs.apk }} new.apk
          curl -sL -o old.apk https://github.com/${{ github.repository }}/releases/download/v3.0.1/noor.apk
          sha256sum old.apk new.apk | tee sha.txt
          { echo "== old (released v3.0.1)"; keytool -printcert -jarfile old.apk | grep -E "Owner|SHA256|Valid"; echo "== new"; keytool -printcert -jarfile new.apk | grep -E "Owner|SHA256|Valid"; } | tee cert.txt
          O=$(keytool -printcert -jarfile old.apk | grep SHA256); N=$(keytool -printcert -jarfile new.apk | grep SHA256); [ "$O" = "$N" ] && echo "CERT MATCH" | tee -a cert.txt || echo "CERT MISMATCH" | tee -a cert.txt
          mkdir -p /tmp/emu-art; cp sha.txt cert.txt /tmp/emu-art/
          rm -rf priv
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash new/ci/${{ matrix.script }} 34
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.script }}
          path: /tmp/emu-*
